[project]
name = "narada"
version = "1.0.0"
description = "A personal autonomous agent runtime."
authors = [{ name = "Neelaksh Saxena" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pytest-asyncio>=0.21.1",
    "Pillow>=10.0.0",
    "textual>=0.47.1",
    "rich>=13.7.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "providers", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
